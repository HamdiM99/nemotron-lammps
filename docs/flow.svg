<svg xmlns="http://www.w3.org/2000/svg" width="680" height="630" viewBox="0 0 680 630" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Agent flow: the model proposes, the code verifies</title>
<desc>A prompt goes to the model, which picks parameters. Code checks the bounds and can refuse, writes the LAMMPS input, LAMMPS runs a smoke run then a full run, code checks the result and writes the assumptions with units, the model copies them into the answer, and every call is logged to a trace judged by code.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.th{font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.ts{font-size:12px;text-anchor:middle;dominant-baseline:central}
.lg{font-size:12px;fill:#444441;dominant-baseline:central}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.m{fill:#EEEDFE;stroke:#534AB7}.mt{fill:#3C3489}.ms{fill:#534AB7}
.c{fill:#E1F5EE;stroke:#0F6E56}.ct{fill:#085041}.cs{fill:#0F6E56}
.n{fill:#F1EFE8;stroke:#5F5E5A}.nt{fill:#2C2C2A}
</style>
</defs>
<rect x="0.5" y="0.5" width="679" height="629" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>

<rect class="n" x="60" y="40" width="240" height="44" rx="8"/>
<text class="th nt" x="180" y="62">Prompt</text>
<line class="arr" x1="180" y1="84" x2="180" y2="116" marker-end="url(#arrow)"/>

<rect class="m" x="60" y="124" width="240" height="56" rx="8"/>
<text class="th mt" x="180" y="142">Model picks parameters</text>
<text class="ts ms" x="180" y="162">Sees bounds and units</text>
<line class="arr" x1="300" y1="140" x2="372" y2="140" marker-end="url(#arrow)"/>
<line class="arr" x1="380" y1="164" x2="308" y2="164" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

<rect class="c" x="380" y="124" width="240" height="56" rx="8"/>
<text class="th ct" x="500" y="142">Code checks bounds</text>
<text class="ts cs" x="500" y="162">Refuses, model retries</text>
<line class="arr" x1="500" y1="180" x2="500" y2="212" marker-end="url(#arrow)"/>

<rect class="c" x="380" y="220" width="240" height="56" rx="8"/>
<text class="th ct" x="500" y="238">Code writes LAMMPS input</text>
<text class="ts cs" x="500" y="258">Model never writes it</text>
<line class="arr" x1="500" y1="276" x2="500" y2="308" marker-end="url(#arrow)"/>

<rect class="c" x="380" y="316" width="240" height="56" rx="8"/>
<text class="th ct" x="500" y="334">LAMMPS runs</text>
<text class="ts cs" x="500" y="354">Smoke first, then full</text>
<line class="arr" x1="500" y1="372" x2="500" y2="404" marker-end="url(#arrow)"/>

<rect class="c" x="380" y="412" width="240" height="56" rx="8"/>
<text class="th ct" x="500" y="430">Code checks and reports</text>
<text class="ts cs" x="500" y="450">Plausibility, units written</text>
<line class="arr" x1="380" y1="440" x2="308" y2="440" marker-end="url(#arrow)"/>

<rect class="m" x="60" y="412" width="240" height="56" rx="8"/>
<text class="th mt" x="180" y="430">Model copies the report</text>
<text class="ts ms" x="180" y="450">Value and assumptions</text>
<line class="arr" x1="180" y1="468" x2="180" y2="500" marker-end="url(#arrow)"/>
<line class="arr" x1="500" y1="468" x2="500" y2="500" marker-end="url(#arrow)"/>

<rect class="n" x="60" y="508" width="240" height="44" rx="8"/>
<text class="th nt" x="180" y="530">Answer</text>
<rect class="n" x="380" y="508" width="240" height="44" rx="8"/>
<text class="th nt" x="500" y="530">Trace, judged by code</text>

<rect class="m" x="60" y="588" width="14" height="14" rx="3"/>
<text class="lg" x="82" y="595">Model (Nemotron)</text>
<rect class="c" x="230" y="588" width="14" height="14" rx="3"/>
<text class="lg" x="252" y="595">Deterministic code and solver</text>
<line class="arr" x1="470" y1="595" x2="500" y2="595" stroke-dasharray="4 4"/>
<text class="lg" x="508" y="595">Refusal sent back</text>
</svg>
